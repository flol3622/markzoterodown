[project]
name = "markzoterodown"
version = "0.1.0"
description = "MCP server providing full-text Markdown access to Zotero library attachments"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Philippe Soubrier", email = "philippe.soubrier@gmail.com" }
]
keywords = ["mcp", "zotero", "markdown", "research", "pdf", "markitdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9",
    "pyzotero>=1.5",
    "markitdown[all]>=0.1",
]

[project.urls]
Homepage = "https://github.com/flol3622/markzoterodown"
Repository = "https://github.com/flol3622/markzoterodown"
Issues = "https://github.com/flol3622/markzoterodown/issues"

# This entry point is what lets `uvx markzoterodown` work directly.
[project.scripts]
markzoterodown = "markzoterodown.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markzoterodown"]
