[project]
name = "markzoterodown"
version = "0.1.0"
description = "MCP server: full-text Markdown access to Zotero attachments"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9",
    "pyzotero>=1.5",
    "markitdown[all]>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
